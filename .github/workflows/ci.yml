# CI on GitHub-hosted runners (owner chat decision 2026-10-24, ADR 0002a, plan/progress/N1.md).
#
# Tools come from the repository's flake (`nix develop`): its Go is the one that reproduces
# bob-builder bit for bit (pkg/engine/store/builders.go, R-NIX-015), so the `builder` stage holds.
# The stages that need a live S3 backend, forges, the acceptance repositories or a quiet host
# (unit as a whole, acceptance, parity, budgets, errors) stay with `go run ./tools/ci` on a
# developer machine; this workflow runs the ones a hosted runner can run.
name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake:
    name: nix flake check (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # bob, bob-server (with the web UI) and the hermetic unit tests, for this runner's system;
      # the other system is evaluated only.
      - name: nix flake check
        run: nix flake check -L
      - name: nix build .#default
        run: nix build -L .#default && ./result/bin/bob version
      # bob's rootless store needs unprivileged user namespaces, which Ubuntu 24.04 restricts
      # with AppArmor (BOB-E-7005 prints this fix).
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The flake variant against its real static Nix: copy into the state home, namespace,
      # bob's nix.conf (pkg/engine/store/nixsystem_test.go).
      - name: Store tests of the flake variant
        run: |
          export BOB_TEST_SYSTEM_NIX="$(nix build --no-link --print-out-paths .#bob.nixStatic)/bin/nix"
          nix develop --command go test -count=1 -tags nixsystem ./pkg/engine/store \
            -run 'TestParseNixVersion|TestSystemNix|TestNixVersion|TestOpenLayoutAndOnlyStat'
      - name: bob doctor (flake variant)
        run: BOB_HOME="$RUNNER_TEMP/bobhome" ./result/bin/bob doctor

  checks:
    name: tools/ci stages
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # builder and docs compare against earlier commits.
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: go run ./tools/ci
        run: nix develop --command go run ./tools/ci -only fmt,vet,lint,layering,licence,docs,website,web,builder,golden
