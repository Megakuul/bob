syntax = "proto3";

package bob.release.v1;

import "bob/authz/v1/authz.proto";
import "bob/common/v1/common.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

service ReleaseService {
  rpc ListReleases(ListReleasesRequest) returns (ListReleasesResponse) {
    option (bob.authz.v1.rule) = {kind: KIND_PUBLIC};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetRelease(GetReleaseRequest) returns (GetReleaseResponse) {
    option (bob.authz.v1.rule) = {kind: KIND_PUBLIC};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // bob install: "<project>/<name>@<constraint>" + platform → release and closure roots.
  rpc ResolveRelease(ResolveReleaseRequest) returns (ResolveReleaseResponse) {
    option (bob.authz.v1.rule) = {kind: KIND_PUBLIC};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc UpdateRelease(UpdateReleaseRequest) returns (UpdateReleaseResponse) {
    option (bob.authz.v1.rule) = {
      kind: KIND_PROJECT
      project_field: "id"
      resolve: RESOLVE_RELEASE
    };
  }
  // The only way a release is removed (R-STORE-007).
  rpc DeleteRelease(DeleteReleaseRequest) returns (DeleteReleaseResponse) {
    option (bob.authz.v1.rule) = {
      kind: KIND_PROJECT
      project_field: "id"
      resolve: RESOLVE_RELEASE
    };
  }
}

enum ReleaseState {
  RELEASE_STATE_UNSPECIFIED = 0;
  RELEASE_STATE_PENDING = 1;
  RELEASE_STATE_PUBLISHING = 2;
  RELEASE_STATE_PUBLISHED = 3;
  RELEASE_STATE_FAILED = 4;
  RELEASE_STATE_DELETED = 5;
} // §05.6.4
enum AssetKind {
  ASSET_KIND_UNSPECIFIED = 0;
  ASSET_KIND_APPIMAGE = 1;
  ASSET_KIND_TARBALL = 2;
  ASSET_KIND_FILE = 3;
}
message PlatformClosure {
  string platform = 1;
  repeated string roots = 2; // store paths installed by bob install
  int64 closure_nar_bytes = 3; // bob-served part only
}
message Asset {
  string file = 1; // ^[A-Za-z0-9._+-]{1,128}$
  AssetKind kind = 2;
  string platform = 3;
  int64 size = 4;
  string sha256 = 5; // hex
  string url = 6; // <base>/r/<project>/<name>/<version>/<file>
}
message ImageRef {
  string repository = 1;
  string tag = 2;
  string digest = 3;
}
message Release {
  string id = 1;
  string project_id = 2;
  string name = 3; // release name from bob.go (slug)
  string version = 4; // semver 2.0 without leading v
  bob.common.v1.Visibility visibility = 5;
  ReleaseState state = 6;
  string build_id = 7;
  string sha = 8;
  repeated PlatformClosure closures = 9;
  repeated Asset assets = 10;
  repeated ImageRef images = 11;
  string description = 12; // ≤ 10 KiB, plain text
  google.protobuf.Timestamp created_at = 13;
  string etag = 14;
}
message ListReleasesRequest {
  int32 page_size = 1;
  string page_token = 2;
  string project_id = 3;
  string name = 4;
}
message ListReleasesResponse {
  repeated Release releases = 1;
  string next_page_token = 2;
} // newest version first
message GetReleaseRequest {
  string id = 1;
}
message GetReleaseResponse {
  Release release = 1;
}
message ResolveReleaseRequest {
  string project_id = 1;
  string name = 2;
  string constraint = 3; // "" = highest; "1.4" = highest 1.4.x; "1.4.2" exact (pre-releases only exact)
  string platform = 4;
}
message ResolveReleaseResponse {
  Release release = 1;
  PlatformClosure closure = 2;
  repeated string substituters = 3;
  repeated string public_keys = 4;
}
message UpdateReleaseRequest {
  Release release = 1;
  google.protobuf.FieldMask update_mask = 2;
} // visibility, description only
message UpdateReleaseResponse {
  Release release = 1;
}
message DeleteReleaseRequest {
  string id = 1;
  string etag = 2;
}
message DeleteReleaseResponse {}
